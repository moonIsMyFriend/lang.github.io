<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube 자막 학습</title>
    <link rel="stylesheet" href="../../../com/css/quiz-style.css" />
    <link rel="stylesheet" href="yt.css" />
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="screen-title">
                <h1>YouTube 자막 학습</h1>
                <div class="row">
                    <span class="pill">자막: <span id="cueCount">0</span></span>
                </div>
            </div>

            <section class="box yt-layout">
                <div class="yt-url-bar">
                    <input id="ytUrl" type="url" inputmode="url"
                        placeholder="YouTube URL (예: https://www.youtube.com/watch?v=… 또는 [02:10~03:25])"
                        autocomplete="off" />
                    <button id="btnLoad" type="button" class="yt-btn-search" aria-label="불러오기" title="불러오기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20 20l-3.5-3.5" />
                        </svg>
                    </button>
                </div>

                <div class="yt-toolbar">
                    <label>
                        자막 언어
                        <select id="captionLang" disabled>
                            <option value="fr">fr</option>
                        </select>
                    </label>
                    <label>
                        시작
                        <input id="rangeStart" type="text" placeholder="0:00" style="width:5.5rem" />
                    </label>
                    <label>
                        끝
                        <input id="rangeEnd" type="text" placeholder="선택" style="width:5.5rem" />
                    </label>
                    <label class="yt-file-label">
                        VTT/SRT
                        <input id="vttFile" type="file" accept=".vtt,.srt,text/vtt,text/plain" />
                    </label>
                </div>

                <p id="status" class="yt-status"></p>

                <div class="yt-player-wrap">
                    <div id="player"></div>
                </div>

                <div class="yt-now-panel">
                    <div id="nowCue" class="yt-now is-empty">재생 중인 자막이 여기에 표시됩니다.</div>
                    <button id="btnLoopToggle" type="button" class="ghost yt-loop-toggle" disabled
                        aria-pressed="false" aria-label="구간 반복 켜기" title="구간 반복 켜기">
                        <span class="yt-loop-icon yt-loop-icon--off" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 2.1l4 4-4 4" />
                                <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                                <path d="M7 21.9l-4-4 4-4" />
                                <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                                <path d="M4 4l16 16" />
                            </svg>
                        </span>
                        <span class="yt-loop-icon yt-loop-icon--on" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 2.1l4 4-4 4" />
                                <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                                <path d="M7 21.9l-4-4 4-4" />
                                <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                            </svg>
                        </span>
                    </button>
                </div>

                <div class="yt-meta">
                    <span>목록 클릭: 해당 구간 이동</span>
                    <span><kbd>←</kbd> <kbd>→</kbd> 이전·다음</span>
                    <span><kbd>R</kbd> 반복</span>
                    <span><kbd>Space</kbd> 재생/일시정지</span>
                </div>

                <div id="cueList" class="yt-cue-list">
                    <p class="muted yt-cue-empty">URL을 입력하고 돋보기를 누르면 자막 목록이 표시됩니다.</p>
                </div>

                <p class="yt-hint">
                    URL에 <span class="kbd">[02:10~03:25]</span> 형식을 넣으면 해당 구간 자막만 표시합니다.
                    자막은 learnlang 서버를 통해 불러옵니다 (로컬: <span class="kbd">learnlang_server</span> 포트 8765).
                </p>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
