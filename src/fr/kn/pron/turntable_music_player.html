<html lang="ko">

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프랑스어 기초어휘와 발음</title>
    <!-- TP-7 프레임: styletest/turntable_music_player (7).html 포크 + quiz-app -->
    <link rel="stylesheet" href="../../../com/css/quiz-style.css" />
    <link rel="stylesheet" href="../../../com/css/turntable-player.css" />
</head>

<body class="turntable-quiz-page" data-quiz-home-url="./index.html">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T3SXCHL6"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="wrap">
            <!-- quiz-app용 카운터(화면 비표시) -->
            <span id="totalCnt" class="sr-only" aria-hidden="true">0</span>
            <span id="selId" class="sr-only" aria-hidden="true">—</span>

            <div class="screen-title">
                <h1 id="pageTitle">Français pronunciation practice</h1>
            </div>

            <section id="screen1" class="hidden" hidden aria-hidden="true" style="display:none">
                <div class="box">
                    <p class="sub" style="display:none"></p>
                    <details>
                        <summary>사용자 CSV 파일</summary>
                        <div class="content">
                            <input id="csvFile" type="file" accept=".csv" />
                            <button id="btnDemo" class="ghost" hidden type="button">데모 로드</button>
                            <button id="btnSample" class="ghost" hidden type="button">샘플 CSV 다운로드</button>
                            <button id="btnPick" class="primary" type="button">Start</button>
                        </div>
                    </details>
                </div>
            </section>

            <section id="screen2" class="hidden">
                    <!-- quiz-app 전용(패드 다음 트리거). 화면에는 turntable 하단 ▶▶ 만 사용 -->
                    <button type="button" id="btnNext" class="primary sr-only" disabled tabindex="-1" aria-hidden="true">Next</button>

                <main class="app tp-main">
                    <section class="device-wrap">
                        <div class="device">
                            <div class="display study-display" aria-live="polite">
                                <div class="study-row">
                                    <div id="tpExpr" class="study-val" aria-label="표현">—</div>
                                </div>
                                <div class="study-row study-row-meta">
                                    <div class="study-meta-scroll" role="region" aria-label="발음, 뜻 및 참고">
                                        <div id="tpPron" class="study-val" aria-label="발음">—</div>
                                        <div id="tpMean" class="study-val" aria-label="뜻">—</div>
                                        <div id="tpComment" class="study-val" aria-label="comment"></div>
                                    </div>
                                </div>
                                <div class="tp-display-footer">
                                    <div id="barWrap" class="tp-bar-wrap tp-bar-wrap--in-display">
                                        <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"
                                            aria-valuenow="0" id="barUnified" class="tp-bar-unified">
                                            <div id="barProgress" class="tp-bar-progress"></div>
                                            <div id="barCorrect" class="tp-bar-correct"></div>
                                            <div id="barLabel" class="tp-bar-label"></div>
                                            <span id="barTotal" class="tp-bar-total">0</span>
                                        </div>
                                    </div>
                                    <div id="tpSpeed" class="tp-speed-display" aria-label="재생 속도">x1</div>
                                    <div class="mini-play" id="miniPlay" role="button" tabindex="0" title="듣기">▶</div>
                                </div>
                            </div>

                            <button type="button" class="orange-tab" id="btnSettings" aria-label="학습 설정" title="학습 설정">M</button>

                            <div class="disc" id="disc">
                                <div class="hub"></div>
                            </div>

                            <button type="button" class="round-btn plus" id="volUp" aria-label="속도 증가">+</button>
                            <button type="button" class="round-btn minus" id="volDown" aria-label="속도 감소">−</button>
                            <div class="tp-device-nav">
                                <button type="button" id="btnHome" class="tp-home-btn" aria-label="목록" title="목록">
                                    <svg class="tp-home-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
                                        <line x1="4" y1="5" x2="20" y2="5" />
                                        <line x1="4" y1="10" x2="20" y2="10" />
                                        <line x1="4" y1="15" x2="20" y2="15" />
                                        <line x1="4" y1="20" x2="20" y2="20" />
                                    </svg>
                                </button>
                                <button id="btnGrade" type="button" class="tp-grade-btn tp-grade-device-btn" disabled aria-label="Check" title="단어 퀴즈 · 채점">
                                    <svg class="tp-grade-quiz-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M16 3v6h6" />
                                        <path d="M12 5H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6" />
                                        <path d="M8 13h6" />
                                        <path d="M8 17h4" />
                                        <g transform="translate(11 11) scale(0.38)" stroke-width="2.65">
                                            <circle cx="12" cy="12" r="10" />
                                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                                            <path d="M12 17h.01" />
                                        </g>
                                    </svg>
                                </button>
                            </div>

                            <div class="bottom-buttons">
                                <div class="tp-bottom-pad-record">
                                    <div id="pronounceRecProgress" class="pronounce-rec-progress-slot pronounce-rec-progress-in-device" aria-live="polite"></div>
                                    <button type="button" class="pad record-dot" id="recordBtn" aria-label="발음 녹음">●</button>
                                </div>
                                <button type="button" class="pad play-symbol" id="padPlay" aria-label="듣기">▶</button>
                                <button type="button" class="pad stop-symbol" id="padNext" aria-label="다음">▶▶</button>
                                <div class="equalizer" id="equalizer" aria-label="레벨 미터">
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                    <span class="eq-bar"></span>
                                </div>
                            </div>

                            <audio id="audioPlayer" preload="metadata"></audio>
                            <button type="button" id="btnAudio" class="sr-only" disabled>🔊 듣기</button>

                            <div class="quiz-feed-hidden" aria-hidden="true">
                                <div id="ko"></div>
                                <div id="enMask"></div>
                                <div id="answerWrap" style="display:none">
                                    <div id="enFull"></div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div id="pronouncePanel" class="box tp-pronounce-panel" style="margin-top:14px">
                        <!-- quiz-app 전용 트리거(화면 비표시). 발음은 장치 빨간 녹음 패드만 사용 -->
                        <button type="button" id="btnPronounceRecord" class="sr-only" tabindex="-1" aria-hidden="true">발음 녹음</button>
                        <div class="row pron-row">
                            <span id="pronounceApiKeyWrap" class="pronounce-key-wrap">
                            <input type="password" id="pronounceApiKey"
                                placeholder="이용 발급 key"
                                autocomplete="off"
                                title="관리자에게 받은 이용 발급 key가 있을 때만 입력하세요. 이 브라우저에만 저장됩니다."
                                style="flex:1; min-width:140px;max-width:220px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:#FDFBF4;color:#333" />
                            </span>
                            <select id="pronounceLocale" title="Recognition language (Speech API locale)">
                                <option value="fr-FR" selected>프랑스어 fr-FR</option>
                                <option value="en-US">영어 en-US</option>
                                <option value="en-GB">영어 en-GB</option>
                                <option value="ko-KR">한국어 ko-KR</option>
                                <option value="ja-JP">일본어 ja-JP</option>
                                <option value="es-ES">스페인어 es-ES</option>
                                <option value="de-DE">독일어 de-DE</option>
                                <option value="zh-CN">중국어(간체) zh-CN</option>
                            </select>
                        </div>
                        <div id="pronounceStatus" class="muted" style="margin-top:8px;font-size:13px;"></div>
                        <div id="pronounceOutcome" class="pronounce-outcome"></div>
                    </div>
                </main>
            </section>

            <section id="screen3" class="hidden">
                <div class="box">
                    <h2 style="margin-top:0">Result</h2>
                    <p class="big" id="finalLine">—</p>
                    <div class="row" style="margin-top:10px">
                        <button id="btnRestart" class="primary" type="button">Retry</button>
                        <button id="btnHome2" type="button" class="ghost">Home</button>
                    </div>
                </div>
            </section>


    </div>

    <div id="tpSettingsModal" class="tp-settings-modal hidden" role="dialog" aria-modal="true"
        aria-labelledby="tpSettingsTitle" hidden>
        <div class="tp-settings-backdrop" data-close-settings tabindex="-1" aria-hidden="true"></div>
        <div class="tp-settings-dialog box card">
            <div class="row tp-settings-head">
                <h2 id="tpSettingsTitle" style="margin:0">학습 설정</h2>
                <button type="button" class="ghost" id="btnCloseSettings" aria-label="닫기">✕</button>
            </div>
            <div class="box" style="margin-top:12px">
                <div class="row" style="margin-top:4px">
                    <span class="muted">문제 출제 방식:</span>
                    <label><input type="radio" name="mode" id="modeRandom" value="random" checked> 랜덤</label>
                    <label style="margin-left:12px"><input type="radio" name="mode" id="modeSeq" value="seq"> 순차</label>
                </div>
                <div class="row" style="margin-top:8px">
                    <span class="muted">모드 선택:</span>
                </div>
                <div>
                    <label style="margin-left:12px"><input type="radio" name="practice" id="practiceQuiz" value="quiz"> 퀴즈(빈칸 채우기)</label>
                </div>
                <div>
                    <label style="margin-left:12px"><input type="radio" name="practice" id="practiceStudy" value="study" checked> 학습(번역/정답/발음)</label>
                </div>
                <div class="row" style="margin-top:10px">
                    <label for="level">가리기 난이도: <span id="levelLabel" class="hint">30%</span></label>
                    <input id="level" class="range" type="range" min="10" max="80" step="5" value="30" />
                </div>
                <div class="row" style="margin-top:6px">
                    <label><input id="keepFirst" type="checkbox" checked /> 단어 첫 글자는 보이기</label>
                    <label style="margin-left:14px"><input id="minLen" type="number" min="1" max="10" value="3"
                            style="width:64px;"> 글자 이상만 가리기</label>
                </div>
                <div class="row" style="margin-top:10px">
                    <label><input type="checkbox" id="audioLoop" /> 자동 반복 재생</label>
                </div>
                <div class="row" style="margin-bottom:4px">
                    <label><input type="checkbox" id="themeToggle" /> 다크 모드</label>
                </div>
            </div>
            <div class="row" style="margin-top:14px; justify-content:flex-end">
                <button type="button" class="primary" id="btnApplySettings">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initQuizApp } from '../../../com/lib/quiz-app.js';
        import { loadPageTitle } from '../../../com/lib/title.js';
        import { toast } from '../../../com/lib/quiz-core.js';
        import { initTurntableQuizUi } from '../../../com/lib/turntable-quiz-ui.js';
        import { installStudyResultRedirect } from '../../../com/lib/study-result-redirect.js';

        loadPageTitle();

        window.addEventListener('DOMContentLoaded', async () => {
            const app = initQuizApp();
            window.quizApp = app;

            const params = new URLSearchParams(location.search);
            const raw = params.get('file');
            if (!raw || !String(raw).trim()) {
                location.replace('./index.html');
                return;
            }

            const file = decodeURIComponent(String(raw).trim());
            try {
                await app.startWith({ file, count: 'all' });
                installStudyResultRedirect({
                    getSummary: () => window.quizApp?.getPronounceSummary?.(),
                });
                initTurntableQuizUi();
            } catch (e) {
                console.error(e);
                toast('파일을 불러오지 못했습니다. 목록으로 돌아갑니다.');
                location.replace('./index.html');
            }
        });
    </script>

</body>

</html>
