<!doctype html>
<html lang="ko">

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study — pronunciation</title>
    <link rel="stylesheet" href="../../../com/css/quiz-style.css" />
</head>

<body data-quiz-home-url="./index.html">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T3SXCHL6"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="wrap">
        <div class="card">

            <div class="screen-title">
                <h1 id="pageTitle">Français pronunciation practice</h1>
                <div class="row">
                    <span class="pill">rows: <span id="totalCnt">0</span></span>
                </div>
            </div>

            <!-- quiz-app이 참조하는 설정용 — 목록 화면과 동일 id (숨김) -->
            <section id="screen1" class="hidden" hidden aria-hidden="true" style="display:none">
                <div class="box">
                    <p class="sub" style="display:none"></p>
                    <details>
                        <summary>사용자 CSV 파일</summary>
                        <div class="content">
                            <input id="csvFile" type="file" accept=".csv" />
                            <button id="btnDemo" class="ghost" hidden type="button">데모 로드</button>
                            <button id="btnSample" class="ghost" hidden type="button">샘플 CSV 다운로드</button>
                            <button id="btnPick" class="primary" type="button">Start</button>
                        </div>
                    </details>
                    <div class="box">
                        <label><input type="radio" name="mode" id="modeRandom" value="random" checked> 랜덤</label>
                        <label><input type="radio" name="mode" id="modeSeq" value="seq"> 순차</label>
                        <label><input type="radio" name="practice" id="practiceQuiz" value="quiz"> 퀴즈</label>
                        <label><input type="radio" name="practice" id="practiceStudy" value="study" checked> 학습</label>
                        <label for="level">난이도 <span id="levelLabel" class="hint">30%</span></label>
                        <input id="level" class="range" type="range" min="10" max="80" step="5" value="30" />
                        <label><input id="keepFirst" type="checkbox" checked /> 첫 글자 보이기</label>
                        <input id="minLen" type="number" min="1" max="10" value="3" />
                        <label><input type="checkbox" id="audioLoop" /> 자동 반복 재생</label>
                        <label><input type="checkbox" id="themeToggle" /> 다크 모드</label>
                    </div>
                </div>
            </section>

            <!-- 학습 화면 -->
            <section id="screen2" class="hidden">
                <div class="box">
                    <div class="row" class="card">
                        <button id="btnHome" type="button" class="ghost">Home</button>
                        <button id="btnGrade" type="button" disabled>Check</button>
                        <button id="btnNext" class="primary" type="button" disabled>Next</button>
                    </div>

                    <div id="barWrap" style="display:flex; align-items:center; gap:8px; margin-top:10px;">
                        <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"
                            aria-valuenow="0" id="barUnified"
                            style="position:relative; height:12px; flex:1; background:#111827; border:1px solid #334155; border-radius:999px; overflow:hidden;">
                            <div id="barProgress"
                                style="position:absolute; left:0; top:0; height:100%; width:0%; background:#334155; transition:width .25s;">
                            </div>
                            <div id="barCorrect"
                                style="position:absolute; left:0; top:0; height:100%; width:0%; background:var(--good); transition:width .25s;">
                            </div>
                            <div id="barLabel"
                                style="position:absolute; left:8px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:700; color:#e5e7eb; text-shadow:0 1px 2px rgba(0,0,0,.5); pointer-events:none;">
                                0
                            </div>
                        </div>
                        <span id="barTotal"
                            style="min-width:36px; text-align:right; color:#94a3b8; font-variant-numeric:tabular-nums;">
                            0
                        </span>
                    </div>
                </div>

                <div style="height:14px"></div>

                <details open>
                    <summary><span class="pill">no.
                            <span id="selId" class="id">—</span></span>
                        <button id="btnAudio" type="button" class="ghost" disabled>🔊 듣기</button>
                        <audio id="audioPlayer" preload="metadata"></audio>
                    </summary>

                    <div class="content">
                        <div>
                            <div class="muted"></div>
                            <div id="ko" class="big">—</div>
                        </div>
                        <div style="height:12px"></div>
                        <div>
                            <div id="enMask" class="big">—</div>
                        </div>
                        <div id="answerWrap" style="display:none; margin-top:12px">
                            <div id="enFull" class="big"></div>
                        </div>
                        <div id="pronouncePanel" style="margin-top:14px">
                            <div class="row pron-row">
                                <span id="pronounceApiKeyWrap" class="pronounce-key-wrap">
                                <input type="password" id="pronounceApiKey"
                                    placeholder="이용 발급 key"
                                    autocomplete="off"
                                    title="관리자에게 받은 이용 발급 key가 있을 때만 입력하세요. 이 브라우저에만 저장됩니다."
                                    style="flex:1; min-width:140px;max-width:220px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:#FDFBF4;color:#333" />
                                </span>
                                <select id="pronounceLocale" title="Recognition language (Speech API locale)">
                                    <option value="fr-FR" selected>프랑스어 fr-FR</option>
                                    <option value="en-US">영어 en-US</option>
                                    <option value="en-GB">영어 en-GB</option>
                                    <option value="ko-KR">한국어 ko-KR</option>
                                    <option value="ja-JP">일본어 ja-JP</option>
                                    <option value="es-ES">스페인어 es-ES</option>
                                    <option value="de-DE">독일어 de-DE</option>
                                    <option value="zh-CN">중국어(간체) zh-CN</option>
                                </select>
                                <span class="pronounce-record-stack">
                                <span id="pronounceRecProgress" class="pronounce-rec-progress-slot" aria-live="polite"></span>
                                <button type="button" id="btnPronounceRecord" class="ghost" aria-label="마이크 활성 · 녹음 시작" title="마이크 활성 · 녹음 시작"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
                                </span>
                            </div>
                            <div id="pronounceStatus" class="muted" style="margin-top:8px;font-size:13px;"></div>
                            <div id="pronounceOutcome" class="pronounce-outcome"></div>
                        </div>
                    </div>
                </details>
            </section>

            <section id="screen3" class="hidden">
                <div class="box">
                    <h2 style="margin-top:0">Result</h2>
                    <p class="big" id="finalLine">—</p>
                    <div class="row" style="margin-top:10px">
                        <button id="btnRestart" class="primary" type="button">Retry</button>
                        <button id="btnHome2" type="button" class="ghost">Home</button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script type="module">
        import { initQuizApp } from '../../../com/lib/quiz-app.js';
        import { loadPageTitle } from '../../../com/lib/title.js';
        import { toast } from '../../../com/lib/quiz-core.js';

        loadPageTitle();

        window.addEventListener('DOMContentLoaded', async () => {
            const app = initQuizApp();
            window.quizApp = app;

            const params = new URLSearchParams(location.search);
            const raw = params.get('file');
            if (!raw || !String(raw).trim()) {
                location.replace('./index.html');
                return;
            }

            const file = decodeURIComponent(String(raw).trim());
            try {
                await app.startWith({ file, count: 'all' });
            } catch (e) {
                console.error(e);
                toast('파일을 불러오지 못했습니다. 목록으로 돌아갑니다.');
                location.replace('./index.html');
            }
        });
    </script>

</body>

</html>
