<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP-7 Style Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #f8f8f6, #d8d8d6 55%, #bfc0bd);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .app {
      width: min(1180px, 96vw);
      display: grid;
      grid-template-columns: 88px minmax(360px, 720px) 240px;
      gap: 26px;
      align-items: center;
    }

    .side-menu {
      height: 620px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 42px;
      color: #333;
    }

    .side-item {
      display: grid;
      justify-items: center;
      gap: 8px;
      font-size: 13px;
      color: #333;
    }

    .side-icon { font-size: 32px; line-height: 1; }

    .device-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .device {
      position: relative;
      width: min(720px, 88vw);
      aspect-ratio: 0.91 / 1;
      border-radius: 18px;
      background: linear-gradient(145deg, #f5f4f1, #cfcfca);
      border: 2px solid rgba(255,255,255,0.78);
      box-shadow: 0 28px 55px rgba(0,0,0,0.28), inset 0 1px 4px rgba(255,255,255,0.9);
      overflow: visible;
    }

    .brand {
      position: absolute;
      top: 34px;
      left: 34px;
      font-size: 28px;
      letter-spacing: 1px;
      color: #333;
    }

    .display {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      max-width: 68%;
      height: 74px;
      border-radius: 10px;
      background: #050505;
      color: #f4f4f4;
      padding: 10px 12px;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.16), 0 5px 12px rgba(0,0,0,0.28);
    }

    .display .time { font-size: 28px; font-family: monospace; }
    .display .song { font-size: 12px; color: #d6d6d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .display .mini-play { position: absolute; right: 10px; bottom: 10px; font-size: 12px; }

    .tiny-dot { position: absolute; top: 54px; width: 7px; height: 7px; background: #151515; border-radius: 50%; }
    .dot1 { left: 46%; } .dot2 { left: 58%; }

    .disc {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 63%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: linear-gradient(145deg, #efefec, #d3d3cf);
      border: 2px solid #191919;
      box-shadow: inset 0 8px 22px rgba(255,255,255,0.62), inset 0 -8px 20px rgba(0,0,0,0.11);
      animation: spin 2.7s linear infinite;
      animation-play-state: paused;
    }

    .disc::after {
      content: "simulavi";
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      letter-spacing: 2px;
      color: rgba(20,20,20,0.78);
      font-weight: 400;
      text-transform: lowercase;
    }

    .disc.playing { animation-play-state: running; }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #202020 0 22%, #101010 45%, #373737 46%, #111 100%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35), inset 0 0 12px rgba(255,255,255,0.08);
    }

    .orange-tab {
      position: absolute;
      right: -12px;
      top: 160px;
      width: 28px;
      height: 30px;
      border-radius: 5px;
      background: #ff5a1f;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .round-btn {
      position: absolute;
      right: 38px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid #999;
      background: linear-gradient(145deg, #f9f9f6, #bebeb8);
      box-shadow:
        0 7px 0 #a7a7a2,
        0 12px 16px rgba(0,0,0,0.20),
        inset 0 1px 3px rgba(255,255,255,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      line-height: 1;
      font-size: 30px;
      cursor: pointer;
      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
    }

    .round-btn:active,
    .round-btn.pressed {
      transform: translateY(5px);
      background: linear-gradient(145deg, #cfcfc9, #f4f4f1);
      box-shadow:
        0 2px 0 #9c9c97,
        0 5px 8px rgba(0,0,0,0.16),
        inset 0 5px 10px rgba(0,0,0,0.12),
        inset 0 -2px 4px rgba(255,255,255,0.6);
    }

    .plus { top: 56%; } .minus { top: 64%; }

    .small-hole {
      position: absolute;
      left: 35px;
      bottom: 150px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2b2b2b;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
    }

    .bottom-buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 125px;
      display: grid;
      grid-template-columns: repeat(3, 1fr) 72px;
      border-top: 4px solid #111;
    }

    .pad {
      border: 0;
      border-right: 4px solid #111;
      background: linear-gradient(145deg, #f2f1ee, #c6c6c0);
      font-size: 28px;
      cursor: pointer;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.8),
        inset 0 -8px 15px rgba(0,0,0,0.08),
        0 7px 0 #9f9f9a,
        0 12px 16px rgba(0,0,0,0.22);
      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
    }

    .pad:active,
    .pad.pressed {
      transform: translateY(6px);
      background: linear-gradient(145deg, #c9c9c4, #efefec);
      box-shadow:
        inset 0 8px 14px rgba(0,0,0,0.18),
        inset 0 -2px 4px rgba(255,255,255,0.55),
        0 1px 0 #8e8e89,
        0 4px 8px rgba(0,0,0,0.18);
    }

    .pad:last-child { border-right: 0; }
    .record-dot { color: #ff4f16; font-size: 36px; }
    .play-symbol { color: #333; }
    .stop-symbol { color: #333; font-size: 18px; }

    .equalizer {
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 5px;
      padding: 18px 12px;
      background: linear-gradient(145deg, #e7e6e2, #c1c1bc);
      overflow: hidden;
    }

    .eq-bar {
      width: 5px;
      height: 12px;
      min-height: 8px;
      max-height: 82px;
      border-radius: 2px;
      background: #222;
      box-shadow: none;
      transition: height 0.055s linear;
    }
.track-info {
      text-align: center;
      width: 100%;
    }

    .track-info h2 { font-size: 28px; margin-bottom: 6px; }
    .track-info p { color: #666; margin-bottom: 16px; }

    .progress-row {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      gap: 12px;
      max-width: 560px;
      margin: 0 auto;
      color: #666;
    }

    input[type="range"] { width: 100%; accent-color: #333; cursor: pointer; }

    .bottom-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      margin-top: 20px;
      font-size: 32px;
    }

    .circle-main {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1px solid #aaa;
      background: linear-gradient(145deg, #f8f8f6, #d7d7d3);
      box-shadow: 0 8px 16px rgba(0,0,0,0.20);
      font-size: 30px;
      cursor: pointer;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: #333;
    }

    .playlist {
      height: 620px;
      border-radius: 18px;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 18px;
    }

    .playlist h3 { margin-bottom: 24px; font-size: 17px; }

    .song-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.13);
      cursor: pointer;
    }

    .cover {
      width: 42px;
      height: 42px;
      border-radius: 4px;
      background: linear-gradient(135deg, #161616, #666);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .song-row strong { display: block; font-size: 13px; }
    .song-row span { display: block; font-size: 12px; color: #555; margin-top: 4px; }
    .song-row.active strong, .song-row.active span { color: #ff4f16; }

    .file-open {
      position: fixed;
      left: 24px;
      bottom: 24px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
      padding: 18px 22px;
      font-size: 15px;
      cursor: pointer;
    }

    #fileInput { display: none; }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 980px) {
      body { align-items: flex-start; overflow: auto; }
      .app { grid-template-columns: 1fr; justify-items: center; }
      .side-menu { display: none; }
      .playlist { width: min(720px, 88vw); height: auto; }
      .file-open { position: static; margin-top: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="side-menu">
      <div class="side-item"><div class="side-icon">♫</div><div>재생 중</div></div>
      <div class="side-item"><div class="side-icon">☷</div><div>재생 목록</div></div>
      <div class="side-item"><div class="side-icon">▢</div><div>내 파일</div></div>
      <div class="side-item"><div class="side-icon">⚙</div><div>설정</div></div>
    </nav>

    <section class="device-wrap">
      <div class="device">
        <div class="brand">TP-7</div>
        <div class="display">
          <div class="time" id="displayTime">0:00</div>
          <div class="song" id="displaySong">music.mp3</div>
          <div class="mini-play" id="miniPlay">▶</div>
        </div>

        <span class="tiny-dot dot1"></span>
        <span class="tiny-dot dot2"></span>
        <div class="orange-tab">M</div>

        <div class="disc" id="disc">
          <div class="hub"></div>
        </div>

        <button class="round-btn plus" id="volUp">+</button>
        <button class="round-btn minus" id="volDown">−</button>
        <div class="small-hole"></div>

        <div class="bottom-buttons">
          <button class="pad record-dot" id="recordBtn">●</button>
          <button class="pad play-symbol" id="padPlay">▶</button>
          <button class="pad stop-symbol" id="padStop">■</button>
          <div class="equalizer" id="equalizer" aria-label="audio equalizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
        </div>
      </div>

      <div class="track-info">
        <h2 id="trackTitle">music.mp3</h2>
        <p id="artistName">Local Music</p>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input type="range" id="progress" min="0" max="100" value="0" />
          <span id="duration">0:00</span>
        </div>
        <div class="bottom-controls">
          <button class="icon-btn">↻</button>
          <button class="icon-btn" id="prevBtn">◀</button>
          <button class="circle-main" id="mainPlay">▶</button>
          <button class="icon-btn" id="nextBtn">▶</button>
          <button class="icon-btn">⤨</button>
        </div>
      </div>
    </section>

    <aside class="playlist">
      <h3>재생 목록</h3>
      <div class="song-row active" data-index="0">
        <div class="cover">01</div><div><strong>music.mp3</strong><span>내 음악 파일</span></div>
      </div>
      <div class="song-row" data-index="1">
        <div class="cover">02</div><div><strong>sample.mp3</strong><span>샘플 파일</span></div>
      </div>
      <div class="song-row" data-index="2">
        <div class="cover">03</div><div><strong>track.mp3</strong><span>추가 파일</span></div>
      </div>
    </aside>
  </main>

  <label class="file-open" for="fileInput">＋ 음악 파일 열기</label>
  <input id="fileInput" type="file" accept="audio/*" />
  <audio id="audio" src="music.mp3"></audio>

  <script>
    const playlist = [
      { title: 'music.mp3', artist: '내 음악 파일', src: 'music.mp3' },
      { title: 'sample.mp3', artist: '샘플 파일', src: 'sample.mp3' },
      { title: 'track.mp3', artist: '추가 파일', src: 'track.mp3' }
    ];

    const audio = document.getElementById('audio');
    const disc = document.getElementById('disc');
    const displayTime = document.getElementById('displayTime');
    const displaySong = document.getElementById('displaySong');
    const miniPlay = document.getElementById('miniPlay');
    const trackTitle = document.getElementById('trackTitle');
    const artistName = document.getElementById('artistName');
    const currentTime = document.getElementById('currentTime');
    const duration = document.getElementById('duration');
    const progress = document.getElementById('progress');
    const eqBars = document.querySelectorAll('.eq-bar');
    const mainPlay = document.getElementById('mainPlay');
    const padPlay = document.getElementById('padPlay');
    const padStop = document.getElementById('padStop');
    const recordBtn = document.getElementById('recordBtn');
    const fileInput = document.getElementById('fileInput');
    const songRows = document.querySelectorAll('.song-row');
    const volUp = document.getElementById('volUp');
    const volDown = document.getElementById('volDown');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 0;
    audio.volume = 0.7;

    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let frequencyData = null;
    let equalizerStarted = false;

    function initEqualizer() {
      if (equalizerStarted) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      audioContext = new AudioContextClass();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 128;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);

      sourceNode = audioContext.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      equalizerStarted = true;
      animateEqualizer();
    }

    function animateEqualizer() {
      requestAnimationFrame(animateEqualizer);

      if (!analyser || audio.paused) {
        eqBars.forEach((bar, index) => {
          const idleHeight = 10 + (index % 3) * 4;
          bar.style.height = `${idleHeight}px`;
        });
        return;
      }

      analyser.getByteFrequencyData(frequencyData);
      const step = Math.floor(frequencyData.length / eqBars.length);

      eqBars.forEach((bar, index) => {
        const start = index * step;
        const slice = frequencyData.slice(start, start + step);
        const avg = slice.reduce((sum, value) => sum + value, 0) / slice.length;
        const height = 8 + (avg / 255) * 78;
        bar.style.height = `${height}px`;
      });
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function setUIPlaying(isPlaying) {
      disc.classList.toggle('playing', isPlaying);
      mainPlay.textContent = isPlaying ? 'Ⅱ' : '▶';
      padPlay.textContent = isPlaying ? 'Ⅱ' : '▶';
      miniPlay.textContent = isPlaying ? 'Ⅱ' : '▶';
    }

    function loadTrack(index, autoPlay = true) {
      currentIndex = (index + playlist.length) % playlist.length;
      const item = playlist[currentIndex];
      audio.src = item.src;
      trackTitle.textContent = item.title;
      artistName.textContent = item.artist;
      displaySong.textContent = item.title;
      songRows.forEach(row => row.classList.remove('active'));
      songRows[currentIndex]?.classList.add('active');
      progress.value = 0;
      currentTime.textContent = '0:00';
      displayTime.textContent = '0:00';
      if (autoPlay) playAudio();
    }

    function playAudio() {
      initEqualizer();
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();
      audio.play().then(() => setUIPlaying(true)).catch(() => {
        setUIPlaying(false);
        alert('음악 파일을 찾을 수 없습니다. HTML 파일과 같은 폴더에 music.mp3, sample.mp3, track.mp3를 넣거나 「음악 파일 열기」를 사용하세요.');
      });
    }

    function togglePlay() {
      if (audio.paused) playAudio();
      else {
        audio.pause();
        setUIPlaying(false);
      }
    }

    function stopAudio() {
      audio.pause();
      audio.currentTime = 0;
      setUIPlaying(false);
    }

    mainPlay.addEventListener('click', togglePlay);
    padPlay.addEventListener('click', togglePlay);
    padStop.addEventListener('click', stopAudio);

    function flashPressed(button) {
      button.classList.add('pressed');
      setTimeout(() => button.classList.remove('pressed'), 140);
    }

    [recordBtn, padPlay, padStop].forEach(button => {
      button.addEventListener('click', () => flashPressed(button));
    });

    audio.addEventListener('loadedmetadata', () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      currentTime.textContent = formatTime(audio.currentTime);
      displayTime.textContent = formatTime(audio.currentTime);
      if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    });

    audio.addEventListener('ended', () => {
      setUIPlaying(false);
      loadTrack(currentIndex + 1, true);
    });

    progress.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
    });

    function flashRoundButton(button) {
      button.classList.add('pressed');
      setTimeout(() => button.classList.remove('pressed'), 140);
    }

    volUp.addEventListener('click', () => {
      flashRoundButton(volUp);
      audio.volume = Math.min(1, audio.volume + 0.1);
    });

    volDown.addEventListener('click', () => {
      flashRoundButton(volDown);
      audio.volume = Math.max(0, audio.volume - 0.1);
    });

    prevBtn.addEventListener('click', () => loadTrack(currentIndex - 1, true));
    nextBtn.addEventListener('click', () => loadTrack(currentIndex + 1, true));

    songRows.forEach(row => {
      row.addEventListener('click', () => loadTrack(Number(row.dataset.index), true));
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileUrl = URL.createObjectURL(file);
      audio.src = fileUrl;
      trackTitle.textContent = file.name;
      artistName.textContent = '선택한 로컬 파일';
      displaySong.textContent = file.name;
      songRows.forEach(row => row.classList.remove('active'));
      playAudio();
    });
  </script>
</body>
</html>
