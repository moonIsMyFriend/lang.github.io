<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth to Moon Scroll</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020611;
      color: #fff;
    }

    .scroll-wrapper {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      display: flex;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-wrapper::-webkit-scrollbar {
      display: none;
    }

    .screen {
      position: relative;
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(60, 120, 255, 0.12), transparent 34%),
        radial-gradient(circle at bottom, rgba(255, 255, 255, 0.08), transparent 35%),
        #020611;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.55) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1.5px);
      background-size: 80px 80px, 130px 130px, 190px 190px;
      background-position: 8px 14px, 40px 70px, 90px 20px;
      opacity: 0.8;
    }

    .planet {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
    }

    /* 지구 화면: 뒤 레이어 = 링·글로우 배경, 앞 = 3D 캔버스만 */
    .earth-backplate {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .earth-backplate-disc {
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, rgba(90, 160, 255, 0.22) 0%, transparent 52%),
        radial-gradient(circle at 50% 55%, rgba(15, 35, 72, 0.55) 0%, #050d1f 58%, #020611 100%);
      box-shadow:
        0 0 32px rgba(120, 200, 255, 0.4),
        0 0 64px rgba(80, 160, 255, 0.22),
        0 0 0 1.5px rgba(180, 230, 255, 0.45);
    }

    .earth-3d-host {
      position: relative;
      z-index: 1;
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      isolation: isolate;
    }

    .earth-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
    }

    /* 달: 밝은 고지 + mare(암흑해) + 크레이터 링 */
    .moon {
      isolation: isolate;
      width: min(62vw, 260px);
      height: min(62vw, 260px);
      background:
        radial-gradient(ellipse 70% 55% at 58% 48%, rgba(55, 52, 58, 0.55) 0%, transparent 62%),
        radial-gradient(ellipse 45% 40% at 28% 62%, rgba(48, 46, 52, 0.5) 0%, transparent 58%),
        radial-gradient(ellipse 38% 32% at 72% 28%, rgba(62, 60, 66, 0.42) 0%, transparent 55%),
        radial-gradient(circle at 22% 32%, rgba(0, 0, 0, 0.22) 0 2.2%, transparent 2.8%),
        radial-gradient(circle at 22% 32%, transparent 2.5%, rgba(255, 255, 255, 0.35) 2.6%, transparent 4.2%),
        radial-gradient(circle at 78% 58%, rgba(0, 0, 0, 0.18) 0 1.8%, transparent 2.4%),
        radial-gradient(circle at 78% 58%, transparent 2.1%, rgba(220, 220, 225, 0.4) 2.2%, transparent 3.5%),
        radial-gradient(circle at 44% 22%, rgba(0, 0, 0, 0.14) 0 1.5%, transparent 2.1%),
        radial-gradient(circle at 52% 78%, rgba(0, 0, 0, 0.16) 0 1.6%, transparent 2.2%),
        radial-gradient(circle at 66% 38%, rgba(0, 0, 0, 0.12) 0 1.2%, transparent 1.8%),
        linear-gradient(145deg, #f4f4f6 0%, #c9c9cf 42%, #8e8e96 78%, #5a5a62 100%);
      box-shadow:
        inset -30px -26px 48px rgba(0, 0, 0, 0.55),
        inset 14px 10px 28px rgba(255, 255, 255, 0.2),
        0 0 38px rgba(200, 210, 230, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: moon-drift 8.5s ease-in-out infinite 0.6s;
    }

    .moon::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 28%,
        rgba(255, 255, 255, 0.55) 0 1%,
        rgba(255, 255, 255, 0.08) 2.5%,
        transparent 4%
      );
      opacity: 0.9;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        118deg,
        rgba(255, 255, 255, 0.12) 0%,
        transparent 35%,
        transparent 58%,
        rgba(0, 0, 0, 0.35) 100%
      );
      pointer-events: none;
    }

    .distance-text {
      position: relative;
      text-align: center;
      z-index: 2;
    }

    .distance-text .number {
      display: block;
      font-size: clamp(52px, 18vw, 96px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .distance-text .label {
      display: block;
      margin-top: 14px;
      font-size: clamp(16px, 5vw, 24px);
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.72);
    }

    .arrow-hint {
      position: absolute;
      right: 22px;
      bottom: 34px;
      z-index: 2;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      animation: blink 1.6s ease-in-out infinite;
    }

    .earth-label,
    .moon-label {
      position: absolute;
      bottom: 92px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.68);
    }

    @keyframes moon-drift {
      0%, 100% {
        transform: translateY(0) translateX(0) rotate(0.25deg);
      }
      35% {
        transform: translateY(-13px) translateX(-3px) rotate(-0.45deg);
      }
      65% {
        transform: translateY(-5px) translateX(5px) rotate(0.15deg);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.35;
        transform: translateX(0);
      }
      50% {
        opacity: 1;
        transform: translateX(6px);
      }
    }

    @media (min-width: 768px) {
      body::before {
        content: "모바일 화면 기준으로 제작된 페이지입니다. 브라우저 폭을 줄이면 더 자연스럽게 보입니다.";
        position: fixed;
        z-index: 10;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        width: max-content;
        max-width: 90vw;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        backdrop-filter: blur(10px);
      }
    }
  </style>
</head>
<body>
  <main class="scroll-wrapper" aria-label="지구에서 달까지 가로 스크롤 페이지">
    <section class="screen earth-screen" aria-label="첫 번째 화면 지구">
      <div class="stars"></div>
      <div class="earth-backplate" aria-hidden="true">
        <div class="earth-backplate-disc"></div>
      </div>
      <div class="earth-3d-host">
        <canvas class="earth-canvas"></canvas>
      </div>
      <div class="earth-label">EARTH</div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen distance-screen" aria-label="두 번째 화면 거리">
      <div class="stars"></div>
      <div class="distance-text">
        <span class="number">4,000km</span>
        <span class="label">DISTANCE</span>
      </div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen moon-screen" aria-label="세 번째 화면 달">
      <div class="stars"></div>
      <div class="planet moon" aria-hidden="true"></div>
      <div class="moon-label">MOON</div>
    </section>
  </main>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    (function () {
      var canvas = document.querySelector(".earth-canvas");
      var container = canvas && canvas.closest(".earth-3d-host");
      if (!canvas || !container || typeof THREE === "undefined") return;

      var reduceMotion = false;
      try {
        reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      } catch (e) {}

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(38, 1, 0.08, 100);
      camera.position.set(0, 0.08, 2.62);
      camera.lookAt(0, 0, 0);

      var renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setClearColor(0x020611, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      if (THREE.SRGBColorSpace !== undefined) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }

      function syncSize() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        if (w < 1 || h < 1) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        camera.lookAt(0, 0, 0);
      }
      syncSize();

      var sunWorld = new THREE.Vector3(2.6, 1.35, 1.85).normalize();

      scene.add(new THREE.AmbientLight(0xffffff, 0.68));
      var key = new THREE.DirectionalLight(0xfff5e8, 1.12);
      key.position.copy(sunWorld.clone().multiplyScalar(6));
      scene.add(key);
      var rim = new THREE.DirectionalLight(0xc8e6ff, 0.22);
      rim.position.set(-3.6, -0.4, -2.0);
      scene.add(rim);

      var earthGroup = new THREE.Group();
      earthGroup.position.set(0, 0, 0);
      earthGroup.rotation.y = 0.65;
      earthGroup.rotation.x = -0.06;
      earthGroup.scale.setScalar(0.9);
      scene.add(earthGroup);

      function landNoise(nx, ny, nz) {
        return (
          Math.sin(nx * 3.8 + nz * 2.1) * 0.42 +
          Math.sin(ny * 4.6 + nx * 2.4) * 0.38 +
          Math.sin((nx * 1.7 + ny * 1.9 + nz * 2.2) * 3.1) * 0.28
        );
      }

      /* -Y 남극: 바다 비율↑(육지 문턱 상승), +Y 북극: 흰 빙상·나무 제외 */
      function landThresholdForLatitude(lat) {
        if (lat >= -0.16) return 0.04;
        var bump = (-0.16 - lat) * 1.05;
        if (bump > 0.68) bump = 0.68;
        return 0.04 + bump;
      }

      function buildLowPolyPlanet() {
        var baseGeo = new THREE.IcosahedronGeometry(1, 2);
        var geo = baseGeo.index ? baseGeo.toNonIndexed() : baseGeo;
        var pos = geo.attributes.position;
        var colors = new Float32Array(pos.count * 3);
        var cOcean = new THREE.Color(0x6ad4ff);
        var cLand = new THREE.Color(0x42b06e);
        var cLandHi = new THREE.Color(0xa8ff9a);
        var cSoil = new THREE.Color(0xc9a06e);
        var cSoilDeep = new THREE.Color(0xa67d52);
        var cDeep = new THREE.Color(0x4abef0);
        var cIceA = new THREE.Color(0xffffff);
        var cIceB = new THREE.Color(0xdceef9);
        var i;
        for (i = 0; i < pos.count; i += 3) {
          var ax = 0;
          var ay = 0;
          var az = 0;
          var k;
          for (k = 0; k < 3; k++) {
            ax += pos.getX(i + k);
            ay += pos.getY(i + k);
            az += pos.getZ(i + k);
          }
          ax /= 3;
          ay /= 3;
          az /= 3;
          var invLen = 1 / Math.sqrt(ax * ax + ay * ay + az * az);
          ax *= invLen;
          ay *= invLen;
          az *= invLen;
          var nVal = landNoise(ax, ay, az);
          var lat = ay;
          var landTh = landThresholdForLatitude(lat);
          var land = nVal > landTh;
          var base;
          if (land) {
            var soilMix = Math.sin(ax * 6.2 + az * 4.1) * 0.5 + Math.sin(ay * 5.3 + az * 3.4) * 0.5;
            if (soilMix > 0.35) {
              base = soilMix > 0.62 ? cSoilDeep : cSoil;
            } else if (Math.sin(ax * 9 + ay * 7) > 0.22) {
              base = cLandHi;
            } else {
              base = cLand;
            }
          } else {
            base = nVal > -0.22 ? cOcean : cDeep;
          }
          base = base.clone();
          /* +Y 북극 빙상: 위도 폭을 기존 대비 약 1/3(북극 근처만), 불투명 색만 */
          if (lat >= 0.89) {
            base.copy(cIceA);
          } else if (lat >= 0.82) {
            base.copy(
              Math.sin(ax * 17 + az * 14 + ay * 5.5) > -0.08 ? cIceA : cIceB
            );
          } else if (lat >= 0.79) {
            if (Math.sin(ax * 13 + az * 11) > 0.12) {
              base.copy(cIceB);
            }
          }
          if (lat < 0.36) {
            var lit = ax * sunWorld.x + ay * sunWorld.y + az * sunWorld.z;
            if (lit < -0.15) {
              base.multiplyScalar(0.92);
            }
          }
          for (k = 0; k < 3; k++) {
            colors[(i + k) * 3] = base.r;
            colors[(i + k) * 3 + 1] = base.g;
            colors[(i + k) * 3 + 2] = base.b;
          }
        }
        geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        var mat = new THREE.MeshLambertMaterial({
          vertexColors: true,
          flatShading: true,
          depthWrite: true,
          depthTest: true,
        });
        return new THREE.Mesh(geo, mat);
      }

      var planet = buildLowPolyPlanet();
      earthGroup.add(planet);

      function placeOnSphere(mesh, dir, radius, scale) {
        var d = dir.clone().normalize();
        mesh.position.copy(d.multiplyScalar(radius));
        mesh.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          dir.clone().normalize()
        );
        if (scale != null && scale !== 1) mesh.scale.setScalar(scale);
      }

      var rnd = 0;
      function rand() {
        rnd = (rnd * 1664525 + 1013904223) % 4294967296;
        return rnd / 4294967296;
      }

      var matTrunk = new THREE.MeshLambertMaterial({
        color: 0x4d3a2a,
        flatShading: true,
      });
      var matNeedle = new THREE.MeshLambertMaterial({
        color: 0x6ef0a8,
        flatShading: true,
      });
      var matBushHi = new THREE.MeshLambertMaterial({
        color: 0x8cff9a,
        flatShading: true,
      });
      var matWide = new THREE.MeshLambertMaterial({
        color: 0x2f8448,
        flatShading: true,
      });
      var matWideTop = new THREE.MeshLambertMaterial({
        color: 0x5ad078,
        flatShading: true,
      });

      function buildTreePine(s) {
        var g = new THREE.Group();
        var trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.011 * s, 0.013 * s, 0.032 * s, 5),
          matTrunk
        );
        var top = new THREE.Mesh(
          new THREE.ConeGeometry(0.03 * s, 0.078 * s, 5),
          matNeedle
        );
        top.position.y = 0.048 * s;
        g.add(trunk);
        g.add(top);
        return g;
      }

      function buildTreeBush(s) {
        var g = new THREE.Group();
        var trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.009 * s, 0.011 * s, 0.022 * s, 4),
          matTrunk
        );
        var ball = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.038 * s, 1),
          matBushHi
        );
        ball.position.y = 0.038 * s;
        g.add(trunk);
        g.add(ball);
        return g;
      }

      function buildTreeWide(s) {
        var g = new THREE.Group();
        var trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.01 * s, 0.012 * s, 0.038 * s, 5),
          matTrunk
        );
        var top = new THREE.Mesh(
          new THREE.ConeGeometry(0.048 * s, 0.055 * s, 6),
          matWideTop
        );
        top.position.y = 0.045 * s;
        var mid = new THREE.Mesh(
          new THREE.ConeGeometry(0.04 * s, 0.045 * s, 6),
          matWide
        );
        mid.position.y = 0.018 * s;
        g.add(trunk);
        g.add(mid);
        g.add(top);
        return g;
      }

      function buildTreeTwin(s) {
        var g = new THREE.Group();
        var trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.01 * s, 0.012 * s, 0.04 * s, 5),
          matTrunk
        );
        var lo = new THREE.Mesh(
          new THREE.ConeGeometry(0.034 * s, 0.05 * s, 5),
          matWide
        );
        lo.position.y = 0.028 * s;
        var hi = new THREE.Mesh(
          new THREE.ConeGeometry(0.026 * s, 0.06 * s, 5),
          matNeedle
        );
        hi.position.y = 0.072 * s;
        g.add(trunk);
        g.add(lo);
        g.add(hi);
        return g;
      }

      var treeBuilders = [
        buildTreePine,
        buildTreeBush,
        buildTreeWide,
        buildTreeTwin,
      ];

      function randomTangentAxis(dir) {
        var ax = new THREE.Vector3(1, 0.15, 0);
        if (Math.abs(ax.dot(dir)) > 0.92) ax.set(0, 1, 0.1);
        var u = new THREE.Vector3().crossVectors(dir, ax);
        if (u.lengthSq() < 1e-8) u.crossVectors(dir, new THREE.Vector3(0, 0, 1));
        u.normalize();
        return u;
      }

      function rotateToward(base, axis, radians) {
        return base.clone().applyAxisAngle(axis, radians).normalize();
      }

      var posAttr = planet.geometry.attributes.position;
      var landDirs = [];
      var ti;
      for (ti = 0; ti < posAttr.count; ti += 3) {
        var lx = (posAttr.getX(ti) + posAttr.getX(ti + 1) + posAttr.getX(ti + 2)) / 3;
        var ly = (posAttr.getY(ti) + posAttr.getY(ti + 1) + posAttr.getY(ti + 2)) / 3;
        var lz = (posAttr.getZ(ti) + posAttr.getZ(ti + 1) + posAttr.getZ(ti + 2)) / 3;
        var llen = 1 / Math.sqrt(lx * lx + ly * ly + lz * lz);
        lx *= llen;
        ly *= llen;
        lz *= llen;
        if (
          landNoise(lx, ly, lz) > landThresholdForLatitude(ly) &&
          ly < 0.74
        ) {
          landDirs.push(new THREE.Vector3(lx, ly, lz));
        }
      }

      for (ti = landDirs.length - 1; ti > 0; ti--) {
        var j = (rand() * (ti + 1)) | 0;
        var tmp = landDirs[ti];
        landDirs[ti] = landDirs[j];
        landDirs[j] = tmp;
      }

      var clusterCount = 7;
      var baseScale = 0.34;
      var used = 0;
      for (ti = 0; ti < clusterCount && used < landDirs.length; ti++) {
        var baseDir = landDirs[used++];
        var typeIdx = (rand() * treeBuilders.length) | 0;
        var builder = treeBuilders[typeIdx];
        var members = 2 + ((rand() * 2) | 0);
        var axis = randomTangentAxis(baseDir);
        var spread = 0.032 + rand() * 0.028;
        var mi;
        for (mi = 0; mi < members; mi++) {
          var ang = (mi - (members - 1) * 0.5) * spread;
          var d = rotateToward(baseDir, axis, ang);
          var jitter = (rand() - 0.5) * 0.022;
          d = rotateToward(d, randomTangentAxis(d), jitter);
          var tree = builder(baseScale * (0.92 + rand() * 0.12));
          placeOnSphere(tree, d, 0.965 + rand() * 0.006, 1);
          earthGroup.add(tree);
        }
      }

      var cloudMat = new THREE.MeshLambertMaterial({
        color: 0xffffff,
        emissive: 0xb8dcff,
        emissiveIntensity: 0.06,
        flatShading: true,
        depthWrite: true,
        depthTest: true,
      });
      var cloudMeshes = [];
      var cloudGeoSmall = new THREE.IcosahedronGeometry(0.018, 0);
      var cloudGeoMed = new THREE.IcosahedronGeometry(0.023, 0);
      var cloudGeoLarge = new THREE.IcosahedronGeometry(0.028, 0);

      function addCloud(dir, radius, geo, sc) {
        var cloud = new THREE.Mesh(geo, cloudMat);
        placeOnSphere(cloud, dir, radius, sc);
        earthGroup.add(cloud);
        cloudMeshes.push(cloud);
      }

      var c;
      for (c = 0; c < 14; c++) {
        var theta = (c / 14) * Math.PI * 2 + 0.28;
        var phi = 0.48 + (c % 4) * 0.16 + (c % 2) * 0.07;
        var dx = Math.sin(phi) * Math.cos(theta);
        var dy = Math.cos(phi) * 0.78 + (rand() - 0.5) * 0.06;
        var dz = Math.sin(phi) * Math.sin(theta);
        var gPick = c % 3 === 0 ? cloudGeoLarge : c % 3 === 1 ? cloudGeoMed : cloudGeoSmall;
        addCloud(new THREE.Vector3(dx, dy, dz), 0.988 + rand() * 0.008, gPick, 0.52 + rand() * 0.22);
      }
      for (c = 0; c < 10; c++) {
        var t2 = (c / 10) * Math.PI * 2 + 1.1;
        var p2 = 0.62 + (c % 3) * 0.11;
        var ex = Math.sin(p2) * Math.cos(t2);
        var ey = Math.cos(p2) * 0.72;
        var ez = Math.sin(p2) * Math.sin(t2);
        var ax = new THREE.Vector3(ex, ey, ez);
        var tang = randomTangentAxis(ax);
        ax.applyAxisAngle(tang, (rand() - 0.5) * 0.22);
        addCloud(ax, 0.994 + rand() * 0.008, cloudGeoSmall, 0.38 + rand() * 0.18);
      }

      var clock = new THREE.Clock();
      var rotationSpeed = 0.1;
      var vToCam = new THREE.Vector3();
      var vObj = new THREE.Vector3();

      function updateFacingVisibility() {
        vToCam.copy(camera.position).normalize();
        var i;
        for (i = 0; i < cloudMeshes.length; i++) {
          cloudMeshes[i].getWorldPosition(vObj);
          vObj.normalize();
          cloudMeshes[i].visible = vObj.dot(vToCam) > 0.04;
        }
      }

      function tick() {
        requestAnimationFrame(tick);
        var dt = clock.getDelta();
        if (!reduceMotion) {
          earthGroup.rotation.y += dt * rotationSpeed;
        }
        updateFacingVisibility();
        renderer.render(scene, camera);
      }
      tick();

      if (typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(syncSize);
        ro.observe(container);
      } else {
        window.addEventListener("resize", syncSize);
      }

      try {
        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        if (mq.addEventListener) {
          mq.addEventListener("change", function () {
            reduceMotion = mq.matches;
          });
        } else if (mq.addListener) {
          mq.addListener(function () {
            reduceMotion = mq.matches;
          });
        }
      } catch (e2) {}
    })();
  </script>
</body>
</html>
