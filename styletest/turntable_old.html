<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Turntable Music Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #3d2c29 0%, #181214 45%, #09090b 100%);
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      width: min(920px, 94vw);
      padding: 30px;
      border-radius: 28px;
      background: linear-gradient(145deg, #2a1f1f, #151515);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .title h1 {
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .title p {
      color: #cfc4b8;
      font-size: 14px;
    }

    .status-light {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cfc4b8;
      font-size: 13px;
      white-space: nowrap;
    }

    .lamp {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #555;
      box-shadow: 0 0 0 rgba(255, 80, 80, 0);
      transition: 0.3s;
    }

    .lamp.on {
      background: #ff4d4d;
      box-shadow: 0 0 18px rgba(255, 80, 80, 0.95);
    }

    .player-layout {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 300px;
      gap: 28px;
      align-items: center;
    }

    .turntable {
      position: relative;
      min-height: 480px;
      border-radius: 26px;
      background:
        linear-gradient(145deg, #5a4033, #2d211d),
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,0.02) 8px 12px);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.42),
        0 20px 35px rgba(0, 0, 0, 0.35);
      padding: 32px;
      overflow: hidden;
    }

    .turntable::before {
      content: "33 ⅓ RPM";
      position: absolute;
      left: 32px;
      bottom: 24px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13px;
      letter-spacing: 3px;
    }

    .platter {
      position: absolute;
      left: 45%;
      top: 50%;
      width: 370px;
      height: 370px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #1f1f1f 0 58%, #0b0b0b 59% 100%);
      box-shadow:
        inset 0 0 30px rgba(255, 255, 255, 0.08),
        0 18px 40px rgba(0, 0, 0, 0.6);
    }

    .record {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          #e7b450 0 12%,
          #111 13% 18%,
          #050505 19% 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.05),
        inset 0 0 25px rgba(255,255,255,0.08);
      animation: spin 2.2s linear infinite;
      animation-play-state: paused;
    }

    .record::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle,
        transparent 0 9px,
        rgba(255,255,255,0.055) 10px 11px);
      pointer-events: none;
    }

    .record.playing {
      animation-play-state: running;
    }

    .record-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 95px;
      height: 95px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #2a1705;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      background: radial-gradient(circle, #ffdf86, #c17b23);
      z-index: 2;
    }

    .center-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #ddd;
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
      z-index: 4;
    }

    .tonearm-base {
      position: absolute;
      right: 42px;
      top: 76px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle, #c8c8c8 0 20%, #606060 22% 60%, #1e1e1e 62%);
      box-shadow: 0 10px 22px rgba(0,0,0,0.55);
      z-index: 8;
    }

    .tonearm {
      position: absolute;
      right: 78px;
      top: 118px;
      width: 230px;
      height: 12px;
      transform-origin: right center;
      transform: rotate(-34deg);
      border-radius: 99px;
      background: linear-gradient(90deg, #dadada, #7f7f7f);
      box-shadow: 0 5px 12px rgba(0,0,0,0.45);
      transition: transform 0.75s ease;
      z-index: 9;
    }

    .tonearm.playing {
      transform: rotate(-15deg);
    }

    .needle {
      position: absolute;
      left: -18px;
      top: 6px;
      width: 38px;
      height: 18px;
      transform: rotate(18deg);
      clip-path: polygon(0 0, 100% 45%, 0 100%);
      background: #1b1b1b;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.25);
    }

    .album-box {
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(145deg, #111, #252525);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .album-box .small {
      color: #ba9f7a;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .track-title {
      font-size: 23px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .artist {
      color: #cfc4b8;
      font-size: 14px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button, .file-label {
      border: 0;
      cursor: pointer;
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(145deg, #a96c2c, #7a3f16);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
      text-align: center;
      font-size: 14px;
    }

    button:hover, .file-label:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .secondary {
      background: linear-gradient(145deg, #3a3a3a, #1d1d1d);
    }

    input[type="file"] {
      display: none;
    }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: #cfc4b8;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #d08a34;
      cursor: pointer;
    }

    .volume-box {
      display: grid;
      gap: 8px;
      color: #cfc4b8;
      font-size: 13px;
    }

    .playlist {
      display: grid;
      gap: 10px;
    }

    .playlist button {
      text-align: left;
      background: rgba(255,255,255,0.08);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.08);
      font-weight: 600;
    }

    .playlist button.active {
      background: rgba(208, 138, 52, 0.45);
      border-color: rgba(255, 204, 128, 0.55);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 780px) {
      body {
        overflow: auto;
        padding: 20px 0;
      }

      .player-layout {
        grid-template-columns: 1fr;
      }

      .turntable {
        min-height: 410px;
      }

      .platter {
        left: 46%;
        width: min(320px, 78vw);
        height: min(320px, 78vw);
      }

      .tonearm {
        right: 52px;
        width: 180px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div class="title">
        <h1>Retro Turntable</h1>
        <p>LP 턴테이블 스타일 음악 재생 사이트</p>
      </div>
      <div class="status-light">
        <span class="lamp" id="lamp"></span>
        <span id="statusText">STOPPED</span>
      </div>
    </section>

    <section class="player-layout">
      <div class="turntable">
        <div class="platter">
          <div class="record" id="record">
            <div class="record-label">RETRO<br />VINYL</div>
          </div>
          <div class="center-pin"></div>
        </div>
        <div class="tonearm-base"></div>
        <div class="tonearm" id="tonearm">
          <div class="needle"></div>
        </div>
      </div>

      <aside class="controls">
        <div class="album-box">
          <div class="small">NOW PLAYING</div>
          <div class="track-title" id="trackTitle">music.mp3</div>
          <div class="artist">Local Audio Player</div>
        </div>

        <div class="button-row">
          <button id="playBtn">▶ PLAY</button>
          <button class="secondary" id="stopBtn">■ STOP</button>
        </div>

        <label class="file-label" for="fileInput">음악 파일 선택</label>
        <input id="fileInput" type="file" accept="audio/*" />

        <div class="progress-wrap">
          <input type="range" id="progress" min="0" max="100" value="0" />
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
          </div>
        </div>

        <div class="volume-box">
          <label for="volume">Volume</label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
        </div>

        <div class="playlist">
          <button class="active" data-src="music.mp3">01. music.mp3</button>
          <button data-src="sample.mp3">02. sample.mp3</button>
        </div>
      </aside>
    </section>
  </main>

  <audio id="audio" src="music.mp3"></audio>

  <script>
    const audio = document.getElementById('audio');
    const record = document.getElementById('record');
    const tonearm = document.getElementById('tonearm');
    const lamp = document.getElementById('lamp');
    const statusText = document.getElementById('statusText');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progress = document.getElementById('progress');
    const currentTimeText = document.getElementById('currentTime');
    const durationText = document.getElementById('duration');
    const volume = document.getElementById('volume');
    const fileInput = document.getElementById('fileInput');
    const trackTitle = document.getElementById('trackTitle');
    const playlistButtons = document.querySelectorAll('.playlist button');

    audio.volume = 0.8;

    function setPlayingUI(isPlaying) {
      record.classList.toggle('playing', isPlaying);
      tonearm.classList.toggle('playing', isPlaying);
      lamp.classList.toggle('on', isPlaying);
      statusText.textContent = isPlaying ? 'PLAYING' : 'STOPPED';
      playBtn.textContent = isPlaying ? '❚❚ PAUSE' : '▶ PLAY';
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          setPlayingUI(true);
        }).catch(() => {
          alert('음악 파일을 찾을 수 없습니다. 같은 폴더에 music.mp3를 넣거나, 음악 파일 선택 버튼을 사용하세요.');
        });
      } else {
        audio.pause();
        setPlayingUI(false);
      }
    }

    function stopMusic() {
      audio.pause();
      audio.currentTime = 0;
      setPlayingUI(false);
      progress.value = 0;
      currentTimeText.textContent = '00:00';
    }

    function formatTime(seconds) {
      if (Number.isNaN(seconds)) return '00:00';
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    playBtn.addEventListener('click', togglePlay);
    stopBtn.addEventListener('click', stopMusic);

    audio.addEventListener('loadedmetadata', () => {
      durationText.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      progress.value = (audio.currentTime / audio.duration) * 100;
      currentTimeText.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      setPlayingUI(false);
      progress.value = 0;
      currentTimeText.textContent = '00:00';
    });

    progress.addEventListener('input', () => {
      if (!audio.duration) return;
      audio.currentTime = (progress.value / 100) * audio.duration;
    });

    volume.addEventListener('input', () => {
      audio.volume = volume.value;
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const fileUrl = URL.createObjectURL(file);
      audio.src = fileUrl;
      trackTitle.textContent = file.name;
      stopMusic();
      togglePlay();

      playlistButtons.forEach(btn => btn.classList.remove('active'));
    });

    playlistButtons.forEach(button => {
      button.addEventListener('click', () => {
        playlistButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const src = button.dataset.src;
        audio.src = src;
        trackTitle.textContent = src;
        stopMusic();
        togglePlay();
      });
    });
  </script>
</body>
</html>
