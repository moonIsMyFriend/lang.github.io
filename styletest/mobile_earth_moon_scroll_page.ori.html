<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth to Moon Scroll</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020611;
      color: #fff;
    }

    .scroll-wrapper {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      display: flex;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-wrapper::-webkit-scrollbar {
      display: none;
    }

    .screen {
      position: relative;
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(60, 120, 255, 0.12), transparent 34%),
        radial-gradient(circle at bottom, rgba(255, 255, 255, 0.08), transparent 35%),
        #020611;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.55) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1.5px);
      background-size: 80px 80px, 130px 130px, 190px 190px;
      background-position: 8px 14px, 40px 70px, 90px 20px;
      opacity: 0.8;
    }

    .planet {
      position: relative;
      border-radius: 50%;
      box-shadow:
        inset -26px -20px 45px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(120, 180, 255, 0.35);
    }

    .earth {
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.8) 0 5%, transparent 8%),
        radial-gradient(circle at 42% 45%, #2fa66d 0 13%, transparent 14%),
        radial-gradient(circle at 60% 28%, #2a8f58 0 12%, transparent 13%),
        radial-gradient(circle at 58% 64%, #23774f 0 16%, transparent 17%),
        radial-gradient(circle at 28% 62%, #4aac7b 0 10%, transparent 11%),
        linear-gradient(135deg, #5fc4ff, #1459c9 55%, #0a2b7a);
      animation: float 4s ease-in-out infinite;
    }

    .moon {
      width: min(62vw, 260px);
      height: min(62vw, 260px);
      background:
        radial-gradient(circle at 34% 30%, rgba(95,95,95,0.55) 0 7%, transparent 8%),
        radial-gradient(circle at 62% 38%, rgba(90,90,90,0.45) 0 10%, transparent 11%),
        radial-gradient(circle at 46% 68%, rgba(80,80,80,0.4) 0 8%, transparent 9%),
        radial-gradient(circle at 72% 68%, rgba(110,110,110,0.45) 0 5%, transparent 6%),
        linear-gradient(135deg, #f2f2f2, #b8b8b8 60%, #777);
      box-shadow:
        inset -24px -22px 42px rgba(0, 0, 0, 0.45),
        0 0 42px rgba(255, 255, 255, 0.22);
      animation: float 4.5s ease-in-out infinite;
    }

    .distance-text {
      position: relative;
      text-align: center;
      z-index: 2;
    }

    .distance-text .number {
      display: block;
      font-size: clamp(52px, 18vw, 96px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .distance-text .label {
      display: block;
      margin-top: 14px;
      font-size: clamp(16px, 5vw, 24px);
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.72);
    }

    .arrow-hint {
      position: absolute;
      right: 22px;
      bottom: 34px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      animation: blink 1.6s ease-in-out infinite;
    }

    .earth-label,
    .moon-label {
      position: absolute;
      bottom: 92px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.68);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-14px);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.35;
        transform: translateX(0);
      }
      50% {
        opacity: 1;
        transform: translateX(6px);
      }
    }

    @media (min-width: 768px) {
      body::before {
        content: "모바일 화면 기준으로 제작된 페이지입니다. 브라우저 폭을 줄이면 더 자연스럽게 보입니다.";
        position: fixed;
        z-index: 10;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        width: max-content;
        max-width: 90vw;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        backdrop-filter: blur(10px);
      }
    }
  </style>
</head>
<body>
  <main class="scroll-wrapper" aria-label="지구에서 달까지 가로 스크롤 페이지">
    <section class="screen earth-screen" aria-label="첫 번째 화면 지구">
      <div class="stars"></div>
      <div class="planet earth" aria-hidden="true"></div>
      <div class="earth-label">EARTH</div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen distance-screen" aria-label="두 번째 화면 거리">
      <div class="stars"></div>
      <div class="distance-text">
        <span class="number">4,000km</span>
        <span class="label">DISTANCE</span>
      </div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen moon-screen" aria-label="세 번째 화면 달">
      <div class="stars"></div>
      <div class="planet moon" aria-hidden="true"></div>
      <div class="moon-label">MOON</div>
    </section>
  </main>
</body>
</html>
