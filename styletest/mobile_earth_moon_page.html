<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth to Moon Scroll</title>
  <link rel="stylesheet" href="earth_moon_scroll/background.css" />
  <link rel="stylesheet" href="earth_moon_scroll/earth.css" />
  <link rel="stylesheet" href="earth_moon_scroll/rocket.css" />
  <link rel="stylesheet" href="earth_moon_scroll/line.css" />
</head>
<body>
  <main class="scroll-wrapper" aria-label="지구에서 달까지 가로 스크롤 페이지">
    <section class="screen earth-screen" aria-label="첫 번째 화면 지구">
      <div class="stars"></div>
      <div class="earth-backplate" aria-hidden="true">
        <div class="earth-backplate-disc"></div>
      </div>
      <div class="earth-3d-host">
        <canvas class="earth-canvas"></canvas>
      </div>
      <div class="earth-label">EARTH</div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen distance-screen" aria-label="두 번째 화면 거리">
      <div class="stars"></div>
      <div class="distance-text">
        <span class="number">384,400km</span>
        <span class="label">DISTANCE</span>
      </div>
      <div class="arrow-hint">오른쪽으로 스크롤 →</div>
    </section>

    <section class="screen moon-screen" aria-label="세 번째 화면 달">
      <div class="stars"></div>
      <div class="planet moon" aria-hidden="true"></div>
      <div class="moon-label">MOON</div>
    </section>
  </main>
  <p class="rocket-zone-hint" aria-hidden="true">← → 로켓 이동 · 구역 도달 시 페이지 전환</p>
  <div class="rocket-travel" aria-hidden="true">
    <svg class="rocket-trail" aria-hidden="true">
      <defs>
        <linearGradient id="rocket-trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(255, 200, 120, 0.08)" />
          <stop offset="35%" stop-color="rgba(255, 200, 120, 0.65)" />
          <stop offset="100%" stop-color="rgba(255, 180, 90, 0.15)" />
        </linearGradient>
      </defs>
      <path class="rocket-trail-path rocket-trail-path--intro" d="" />
      <path class="rocket-trail-path rocket-trail-path--active" d="" />
    </svg>
    <div class="rocket">
      <div class="rocket__bob">
        <svg class="rocket__svg" viewBox="0 0 48 72" width="52" height="78" aria-hidden="true">
          <defs>
            <linearGradient id="rocket-body" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f4f7ff" />
              <stop offset="100%" stop-color="#8fa0c8" />
            </linearGradient>
            <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fff4a8" />
              <stop offset="45%" stop-color="#ff9a38" />
              <stop offset="100%" stop-color="transparent" />
            </linearGradient>
          </defs>
          <path d="M24 6 L38 50 L10 50 Z" fill="url(#rocket-body)" />
          <circle cx="24" cy="26" r="6" fill="#7ed4ff" stroke="#fff" stroke-width="1" />
          <path d="M10 50 L16 54 L14 62 L8 58 Z" fill="#c94e2e" />
          <path d="M38 50 L32 54 L34 62 L40 58 Z" fill="#c94e2e" />
          <g class="rocket__flame-anim">
            <path d="M16 50 L32 50 L24 70 Z" fill="url(#rocket-flame)" />
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script src="earth_moon_scroll/line.js"></script>
  <script src="earth_moon_scroll/rocket.js"></script>
  <script src="earth_moon_scroll/scroll.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="earth_moon_scroll/earth.js"></script>
</body>
</html>
